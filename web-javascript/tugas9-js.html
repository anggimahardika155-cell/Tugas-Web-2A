<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penggunaan Object</title>
</head>
<body>
    <script type="text/javascript">
        //membuat object dengan construtor
 
        function orang(nama,gender,umur,alamat) {
            this.nama = "Anggi Mahardika Dwi Utami";
            this.gender = "Perempuan";
            this.umur = "21";
            this.alamat = "Nganjuk";
        }
 
        //membuat instance object
        var Dewasa = new orang("Rudy", "L", 30,['jalan kyai mansur', 'doko sragi', 'kab kediri']) ;
 
        console.log(Dewasa);
    </script>
</body>
</html>
